<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="注册 - 农作物病害识别系统">
  <title>注册 - 农作物病害识别系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/common.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #14532d 0%, #166534 50%, #15803d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .bg-decoration { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .bg-decoration::before {
      content: '';
      position: absolute;
      width: 150%;
      height: 150%;
      top: -25%;
      left: -25%;
      background: radial-gradient(circle at 30% 30%, rgba(34, 197, 94, 0.15) 0%, transparent 50%),
                  radial-gradient(circle at 70% 70%, rgba(20, 184, 166, 0.1) 0%, transparent 50%);
      animation: bgFloat 20s ease-in-out infinite;
    }
    @keyframes bgFloat {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(2%, 2%) rotate(1deg); }
    }
    .register-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    .register-card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      animation: cardSlideIn 0.6s cubic-bezier(0.32, 0.72, 0, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    @keyframes cardSlideIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .register-header { text-align: center; margin-bottom: 32px; }
    .register-title { font-size: 1.5rem; font-weight: 700; color: #1e293b; margin-bottom: 8px; }
    .register-subtitle { font-size: 0.875rem; color: #64748b; }
    .error-message {
      display: none;
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 10px;
      color: #dc2626;
      font-size: 0.875rem;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
    }
    .error-message.show { display: flex; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 0.875rem; font-weight: 600; color: #1e293b; margin-bottom: 8px; }
    .form-input-wrapper { position: relative; }
    .form-input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      font-size: 0.9375rem;
      color: #1e293b;
      background: #f8fafc;
      border: 2px solid transparent;
      border-radius: 12px;
      transition: all 0.2s ease;
      outline: none;
    }
    .form-input:focus { background: white; border-color: #22c55e; box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1); }
    .form-input::placeholder { color: #94a3b8; }
    .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
    .input-icon svg { width: 20px; height: 20px; }
    .password-toggle { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; cursor: pointer; padding: 4px; }
    .password-toggle svg { width: 20px; height: 20px; }
    .btn-register {
      width: 100%;
      padding: 16px 24px;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
      margin-top: 8px;
    }
    .btn-register:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5); }
    .btn-register:active { transform: translateY(0); }
    .btn-register.loading { pointer-events: none; opacity: 0.8; }
    .login-link { text-align: center; margin-top: 24px; font-size: 0.875rem; color: #64748b; }
    .login-link a { color: #22c55e; font-weight: 600; text-decoration: none; }
    .login-link a:hover { color: #16a34a; text-decoration: underline; }
    .strength-indicator { display: flex; gap: 4px; margin-top: 8px; }
    .strength-bar { height: 4px; flex: 1; background: #e2e8f0; border-radius: 2px; transition: background 0.2s; }
    .strength-bar.weak { background: #ef4444; }
    .strength-bar.medium { background: #f59e0b; }
    .strength-bar.strong { background: #22c55e; }
    .strength-text { font-size: 0.75rem; margin-top: 4px; }
    .strength-text.weak { color: #ef4444; }
    .strength-text.medium { color: #f59e0b; }
    .strength-text.strong { color: #22c55e; }
    @media (max-width: 500px) {
      .register-card { padding: 32px 24px; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <div class="bg-decoration"></div>
  <div class="register-container">
    <div class="register-card">
      <div class="register-header">
        <h2 class="register-title">创建账户</h2>
        <p class="register-subtitle">注册后即可开始使用病害识别系统</p>
      </div>
      <div class="error-message" id="errorMessage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <span id="errorText">发生错误</span>
      </div>
      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="username">用户名</label>
          <div class="form-input-wrapper">
            <input type="text" class="form-input" id="username" name="username" placeholder="3-50个字符，支持中文、字母、数字、下划线" autocomplete="username" required>
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <div class="form-input-wrapper">
            <input type="password" class="form-input" id="password" name="password" placeholder="至少6个字符" autocomplete="new-password" required>
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <span class="password-toggle" id="passwordToggle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="eyeIcon">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </span>
          </div>
          <div class="strength-indicator" id="strengthIndicator">
            <div class="strength-bar" id="strength1"></div>
            <div class="strength-bar" id="strength2"></div>
            <div class="strength-bar" id="strength3"></div>
            <div class="strength-bar" id="strength4"></div>
          </div>
          <div class="strength-text" id="strengthText"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">确认密码</label>
          <div class="form-input-wrapper">
            <input type="password" class="form-input" id="confirmPassword" name="confirmPassword" placeholder="再次输入密码" autocomplete="new-password" required>
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
          </div>
        </div>
        <button type="submit" class="btn-register" id="registerBtn">
          <span>注册</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </form>
      <p class="login-link">已有账户？<a href="/">立即登录</a></p>
    </div>
  </div>
  <script src="/static/js/common.js"></script>
  <script>
    (function() {
      const token = localStorage.getItem('token');
      if (token) window.location.href = '/dashboard';
    })();

    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');
    const eyeIcon = document.getElementById('eyeIcon');
    const strengthIndicator = document.getElementById('strengthIndicator');
    const strengthText = document.getElementById('strengthText');
    const strengthBars = [
      document.getElementById('strength1'),
      document.getElementById('strength2'),
      document.getElementById('strength3'),
      document.getElementById('strength4')
    ];

    passwordToggle.addEventListener('click', function() {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    });

    passwordInput.addEventListener('input', function() {
      const password = passwordInput.value;
      let strength = 0;
      if (password.length >= 6) strength++;
      if (password.length >= 10) strength++;
      if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength++;
      if (/[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password)) strength++;

      strengthBars.forEach((bar, i) => {
        bar.className = 'strength-bar';
        if (i < strength) {
          if (strength <= 1) bar.classList.add('weak');
          else if (strength <= 2) bar.classList.add('medium');
          else bar.classList.add('strong');
        }
      });

      strengthText.className = 'strength-text';
      if (strength <= 1) { strengthText.textContent = '密码强度：弱'; strengthText.classList.add('weak'); }
      else if (strength <= 2) { strengthText.textContent = '密码强度：中等'; strengthText.classList.add('medium'); }
      else { strengthText.textContent = '密码强度：强'; strengthText.classList.add('strong'); }
    });

    const registerForm = document.getElementById('registerForm');
    const registerBtn = document.getElementById('registerBtn');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');

    registerForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!username) { showError('请输入用户名'); return; }
      if (username.length < 3 || username.length > 50) { showError('用户名长度必须在3-50个字符之间'); return; }
      if (!password) { showError('请输入密码'); return; }
      if (password.length < 6) { showError('密码长度至少6个字符'); return; }
      if (password !== confirmPassword) { showError('两次输入的密码不一致'); return; }

      registerBtn.classList.add('loading');
      registerBtn.innerHTML = '<span>注册中...</span>';
      hideError();

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();

        if (data.code === 0) {
          Utils.showToast('注册成功', '正在跳转登录...', 'success');
          setTimeout(() => { window.location.href = '/'; }, 1500);
        } else {
          showError(data.message || '注册失败');
          registerBtn.classList.remove('loading');
          registerBtn.innerHTML = '<span>注册</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
        }
      } catch (error) {
        showError('网络错误，请稍后重试');
        registerBtn.classList.remove('loading');
        registerBtn.innerHTML = '<span>注册</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
      }
    });

    function showError(message) {
      errorText.textContent = message;
      errorMessage.classList.add('show');
    }
    function hideError() {
      errorMessage.classList.remove('show');
    }
    document.querySelectorAll('.form-input').forEach(input => {
      input.addEventListener('input', hideError);
    });
  </script>
</body>
</html>
