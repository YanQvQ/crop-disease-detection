    a { text-decoration: none; color: inherit; }
    .app-container { display: flex; min-height: 100vh; }
    .sidebar { width: 280px; background: linear-gradient(180deg, #14532d 0%, #166534 50%, #15803d 100%); position: fixed; top: 0; left: 0; bottom: 0; display: flex; flex-direction: column; z-index: 100; transition: transform 0.3s ease; }

    .sidebar-logo { display: flex; align-items: center; gap: 14px; }
    .sidebar-logo-icon { width: 48px; height: 48px; background: rgba(255,255,255,0.15); border-radius: 14px; display: flex; align-items: center; justify-content: center; }
    .sidebar-logo-icon svg { width: 28px; height: 28px; color: white; }
    .sidebar-logo-text { color: white; }
    .sidebar-logo-title { font-size: 1.125rem; font-weight: 700; }
    .sidebar-logo-subtitle { font-size: 0.75rem; opacity: 0.8; margin-top: 2px; }
    .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
    .nav-section { margin-bottom: 24px; }
    .nav-section-title { font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.5); padding: 0 12px; margin-bottom: 8px; }
    .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; color: rgba(255,255,255,0.8); font-size: 0.9375rem; font-weight: 500; transition: all 0.2s; cursor: pointer; margin-bottom: 4px; }
    .nav-item:hover { background: rgba(255,255,255,0.1); color: white; }
    .nav-item.active { background: rgba(255,255,255,0.2); color: white; }
    .nav-item svg { width: 22px; height: 22px; flex-shrink: 0; }
    .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.1); }

    .user-avatar { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #4ade80, #22c55e); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1rem; }

    .header-left { display: flex; align-items: center; gap: 20px; }
    .menu-toggle { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #64748b; cursor: pointer; transition: all 0.2s; }
    .menu-toggle:hover { background: #f1f5f9; color: #1e293b; }
    .menu-toggle svg { width: 24px; height: 24px; }
    .header-title { font-size: 1.125rem; font-weight: 600; color: #1e293b; }

  <script>
    if (!Utils.requireAuth()) {}
    const sidebar = document.getElementById('sidebar'); const mainWrapper = document.getElementById('mainWrapper');
    document.getElementById('menuToggle').addEventListener('click', () => { Utils.toggleSidebar(); });

    async function loadUserInfo() { try { const res = await Utils.apiGet('/api/user/me'); if (res.code === 0) { const user = res.data; document.getElementById('userName').textContent = user.name || user.username; document.getElementById('userRole').textContent = user.role === 'admin' ? '管理员' : '普通用户'; document.getElementById('userAvatar').textContent = (user.name || user.username).charAt(0); if (user.role === 'admin') document.getElementById('navUserManage').style.display = 'flex'; } } catch (error) { console.error('获取用户信息失败:', error); } }

    let currentPage = 1; const pageSize = 12; let allRecords = [];

    async function loadRecords() {
      try {
        const res = await Utils.apiGet('/api/cameraRecords');
        if (res.code === 0) { allRecords = res.data || []; document.getElementById('totalCount').textContent = allRecords.length; renderRecords(); }
      } catch (error) { console.error('加载记录失败:', error); }
    }

    function parseConfidence(confStr) {
      if (!confStr) return '-';
      const list = Utils.parseList(confStr);
      if (Array.isArray(list) && list.length > 0) {
        const maxConf = list.reduce((a, b) => {
          const av = parseFloat(a), bv = parseFloat(b);
          return (isNaN(bv) || av > bv) ? a : b;
        });
        return Utils.confToPct(maxConf);
      }
      return confStr;
    }

    function parseConfList(confStr) {
      if (!confStr) return [];
      const list = Utils.parseList(confStr);
      return Array.isArray(list) ? list : [];
    }

    function parseLabel(labelStr) {
      if (!labelStr) return '未知病害';
      const list = Utils.parseList(labelStr);
      if (Array.isArray(list) && list.length > 0) {
        return [...new Set(list)].join('、');
      }
      return labelStr;
    }

    const EMPTY_HTML_CAMERA = `<div class="empty-state">
      <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
      <h3 class="empty-title">暂无记录</h3>
      <p class="empty-desc">开始使用摄像头预测功能来创建您的第一条记录</p>
    </div>`;

    function renderRecords() {
      const grid = document.getElementById('recordsGrid');
      if (allRecords.length === 0) {
        grid.innerHTML = EMPTY_HTML_CAMERA;
        document.getElementById('pagination').innerHTML = '';
        return;
      }
      const totalPages = Math.ceil(allRecords.length / pageSize);
      if (currentPage > totalPages && totalPages >= 1) currentPage = totalPages;
      const start = (currentPage - 1) * pageSize;
      const pageRecords = allRecords.slice(start, start + pageSize);
      grid.innerHTML = pageRecords.map(record => `
        <div class="record-card">
          <video class="record-video" poster="${Utils.fileUrl(record.out_img) || ''}"><source src="${Utils.fileUrl(record.out_video) || ''}" type="video/mp4"></video>
          <div class="record-content">
            <div class="record-header"><h4 class="record-title">${Utils.escapeHtml(parseLabel(record.label))}</h4><span class="record-badge">已完成</span></div>
            <div class="record-meta">
              <div class="record-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${Utils.escapeHtml(record.all_time || '-')}</div>
              <div class="record-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>${parseConfidence(record.confidence) === '-' ? '未检出' : '最高置信度: ' + parseConfidence(record.confidence)}</div>
              <div class="record-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${Utils.formatDate(record.start_time)}</div>
              <div class="record-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>模型: ${Utils.escapeHtml(record.weight || '-')}</div>
            </div>
            <div class="record-actions">
              <button type="button" class="btn btn-secondary btn-view" data-id="${record.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>查看</button>
              <button type="button" class="btn btn-secondary btn-download" data-id="${record.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载</button>
              <button type="button" class="btn btn-danger btn-delete" data-id="${record.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>删除</button>
            </div>
          </div>
        </div>
      `).join('');
      renderPagination();
    }

    function renderPagination() {
      const totalPages = Math.ceil(allRecords.length / pageSize);
      const pagination = document.getElementById('pagination');
      if (totalPages <= 1) { pagination.innerHTML = ''; return; }
      let html = `<button class="pagination-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>«</button>`;
      for (let i = 1; i <= totalPages; i++) { if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) { html += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`; } else if (i === currentPage - 3 || i === currentPage + 3) { html += '<button class="pagination-btn" disabled>...</button>'; } }
      html += `<button class="pagination-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>»</button>`;
      pagination.innerHTML = html;
    }

    function goPage(page) { currentPage = page; renderRecords(); }

    document.getElementById('recordsGrid').addEventListener('click', (e) => {
      const viewBtn = e.target.closest('.btn-view');
      const downloadBtn = e.target.closest('.btn-download');
      const deleteBtn = e.target.closest('.btn-delete');
      if (viewBtn) {
        e.preventDefault();
        e.stopPropagation();
        const id = parseInt(viewBtn.dataset.id);
        viewDetail(id);
      } else if (downloadBtn) {
        e.preventDefault();
        e.stopPropagation();
        const id = parseInt(downloadBtn.dataset.id);
        downloadResult(id);
      } else if (deleteBtn) {
        e.preventDefault();
        e.stopPropagation();
        const id = parseInt(deleteBtn.dataset.id);
        deleteRecord(id);
      }
    });

    let currentRecord = null;

    function viewDetail(id) {
      const record = allRecords.find(r => r.id === id);
      if (!record) { Utils.showToast('错误', '未找到记录', 'error'); return false; }
      currentRecord = record;
      document.getElementById('detailInputVideo').src = Utils.fileUrl(record.input_video) || '';
      document.getElementById('detailOutputVideo').src = Utils.fileUrl(record.out_video) || '';
      const infoHtml = `
        <div class="detail-info-item"><div class="detail-info-label">检测结果</div><div class="detail-info-value">${Utils.escapeHtml(parseLabel(record.label))}</div></div>
        <div class="detail-info-item"><div class="detail-info-label">最高置信度</div><div class="detail-info-value">${parseConfidence(record.confidence)}</div></div>
        <div class="detail-info-item"><div class="detail-info-label">检测状态</div><div class="detail-info-value">已完成</div></div>
        <div class="detail-info-item"><div class="detail-info-label">检测时间</div><div class="detail-info-value">${Utils.formatDate(record.start_time)}</div></div>
        <div class="detail-info-item"><div class="detail-info-label">处理时长</div><div class="detail-info-value">${Utils.escapeHtml(record.all_time || '-')}</div></div>
        <div class="detail-info-item"><div class="detail-info-label">使用模型</div><div class="detail-info-value">${Utils.escapeHtml(record.weight || '-')}</div></div>
        <div class="detail-info-item"><div class="detail-info-label">用户</div><div class="detail-info-value">${Utils.escapeHtml(record.username || '-')}</div></div>
      `;
      document.getElementById('detailInfo').innerHTML = infoHtml;

      const detailRes = document.getElementById('detailDiseases');
      const labels = Utils.parseList(record.label) || [];
      const confs = parseConfList(record.confidence);
      if (labels.length > 0) {
        Utils.renderDiseaseBlock(labels, confs, detailRes);
      } else {
        detailRes.innerHTML = '<div class="detail-diseases-empty">该记录未检测到病害。可能存在两种情况：摄像头画面中的作物确实健康，或病害程度较轻/姿态不佳未被模型检出。建议结合田间实地情况综合判断，必要时请当地农技专家进一步确认。</div>';
      }

      document.getElementById('detailModal').classList.add('active');
      return false;
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.remove('active');
      const v1 = document.getElementById('detailInputVideo');
      const v2 = document.getElementById('detailOutputVideo');
      try { v1.pause(); v2.pause(); } catch (e) {}
      currentRecord = null;
    }

    function downloadResult(id) {
      const record = allRecords.find(r => r.id === id);
      if (!record) { Utils.showToast('错误', '未找到记录', 'error'); return false; }
      doDownload(record);
      return false;
    }

    function downloadCurrentResult() {
      if (!currentRecord) return false;
      doDownload(currentRecord);
      return false;
    }

    function doDownload(record) {
      try {
        const url = record.out_video;
        if (!url) { Utils.showToast('错误', '视频路径无效', 'error'); return; }
        const filename = url.split('/').pop() || 'result.mp4';
        const downloadName = '摄像头检测结果.mp4';
        const downloadUrl = `/api/download/${filename}?name=${encodeURIComponent(downloadName)}&token=${encodeURIComponent(TokenManager.getToken() || '')}`;
        Utils.showToast('下载', '开始下载...', 'info');
        window.location.href = downloadUrl;
      } catch (e) {
        console.error('下载失败:', e);
        Utils.showToast('错误', '下载失败', 'error');
      }
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetailModal(); });

    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target.id === 'detailModal') closeDetailModal();
    });

    let isDeleting = false;

    async function deleteRecord(id) {
      if (isDeleting) return;
      if (!confirm('确定要删除此记录吗？删除后将无法恢复。')) return;
      isDeleting = true;
      try {
        const res = await Utils.apiDelete(`/api/cameraRecords/${id}`);
        if (res.code === 0) {
          Utils.showToast('成功', '记录已删除', 'success');
          await loadRecords();
        } else {
          Utils.showToast('错误', res.message || '删除失败', 'error');
        }
      } catch (error) {
        console.error('删除失败:', error);
      } finally {
        isDeleting = false;
      }
    }

    document.addEventListener('DOMContentLoaded', () => { loadUserInfo(); loadRecords(); });
  </script>
</body>
</html>
